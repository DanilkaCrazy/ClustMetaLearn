[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clustmetalearn"
version = "0.1.0"
description = "Meta-learning and evolutionary clustering pipelines (ClustMetaLearn)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "deap>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mlflow = ["mlflow>=2.9"]
docker = [
    "mlflow>=2.9",
]
topo = ["ripser>=0.6"]

[project.scripts]
clust-tpot-clustering = "clustmetalearn.tpot_clustering.cli:main"
clust-meta = "clustmetalearn.meta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
