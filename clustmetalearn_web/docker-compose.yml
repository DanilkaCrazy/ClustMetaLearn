services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: clustmetalearn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: bash -c "python manage.py migrate && gunicorn clustmetalearn_web.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - USE_POSTGRES=True
      - USE_CELERY=True
      - POSTGRES_DB=clustmetalearn
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - CELERY_BROKER=redis://redis:6379/0
      - DJANGO_SECRET_KEY=supersecretkey
      - DEBUG=True

  celery:
    build: .
    command: celery -A clustmetalearn_web worker --loglevel=info
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - USE_POSTGRES=True
      - USE_CELERY=True
      - POSTGRES_HOST=db
      - POSTGRES_DB=clustmetalearn
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - CELERY_BROKER=redis://redis:6379/0
      - DJANGO_SECRET_KEY=supersecretkey

volumes:
  postgres_data:
  media_volume:
